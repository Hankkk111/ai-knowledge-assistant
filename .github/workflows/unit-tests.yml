name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request makes the earlier run's result irrelevant, so
# cancel it instead of letting both finish. Runs on main are never cancelled,
# so every commit there keeps its own result.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# These jobs only check out and read the code, so the GITHUB_TOKEN doesn't
# need write access to the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      # tsx runs the tests without type-checking them, so check them here.
      - run: npm run typecheck
      - run: npm test

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Vite 8 requires Node 20.19+ / 22.12+, so pin a current LTS here.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The health-check workflows run scripts/health-check.sh against the live
      # deployments, so catch quoting and `set -e` mistakes before they land.
      # ShellCheck is preinstalled on the GitHub-hosted Ubuntu runners.
      - run: shellcheck scripts/*.sh
